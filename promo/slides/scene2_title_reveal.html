<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Scene 2 - 商品の登場</title>
<link rel="stylesheet" href="./slide_base.css" />
<style>
  body {
    background: radial-gradient(circle at 50% 45%, #ffe600 0%, #ff7300 45%, #b8000c 100%);
  }

  .card-frame {
    position: absolute;
    inset: 42px;
    border: 12px solid #ffffff;
    border-radius: 28px;
    box-shadow: inset 0 0 0 8px #000000, 0 20px 60px rgba(0, 0, 0, 0.55);
    pointer-events: none;
    z-index: 40;
  }

  .center-stack {
    position: relative;
    z-index: 20;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 80px;
  }

  .intro-pill-row {
    display: flex;
    align-items: center;
    gap: 18px;
    opacity: 0;
    transform: translateY(-28px);
    transition: all 0.25s cubic-bezier(0.2, 1.35, 0.4, 1);
  }
  .intro-pill-row.show {
    opacity: 1;
    transform: translateY(0);
  }

  .intro-call {
    font-family: var(--font-gothic);
    font-size: 62px;
    font-weight: 900;
    color: #ffffff;
    paint-order: stroke fill;
    -webkit-text-stroke: 16px #002b80;
    filter: drop-shadow(0 6px 0 #000000);
  }

  /* どデカタイトル看板 */
  .logo-plate {
    background: linear-gradient(180deg, #fffdf0 0%, #ffe680 100%);
    border: 12px solid #e60012;
    border-radius: 36px;
    padding: 42px 86px 46px;
    box-shadow: 0 0 0 10px #ffffff, 0 20px 0 #000000, 0 32px 60px rgba(0, 0, 0, 0.7);
    text-align: center;
    opacity: 0;
    transform: scale(0.65) rotate(-3deg);
    transition: all 0.32s cubic-bezier(0.18, 1.4, 0.45, 1);
  }
  .logo-plate.show {
    opacity: 1;
    transform: scale(1) rotate(-1deg);
  }

  .sub-tag {
    display: inline-block;
    background: linear-gradient(90deg, #0038a8, #0066ff, #0038a8);
    color: #ffe600;
    border: 4px solid #000000;
    border-radius: 999px;
    padding: 8px 34px;
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 0.08em;
    margin-bottom: 18px;
    box-shadow: 0 6px 0 #000;
  }

  .main-title-text {
    font-family: var(--font-gothic);
    font-size: 130px;
    font-weight: 900;
    line-height: 1.1;
    background: linear-gradient(180deg, #ff2a2a 0%, #cc0000 55%, #6e0000 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 6px 0 #ffffff) drop-shadow(6px 0 0 #ffffff) drop-shadow(-6px 0 0 #ffffff) drop-shadow(0 -6px 0 #ffffff) drop-shadow(10px 12px 0 #000000);
    letter-spacing: 0.02em;
  }

  .title-wave {
    font-size: 90px;
    color: #0038a8;
    font-weight: 900;
    paint-order: stroke fill;
    -webkit-text-stroke: 14px #ffffff;
    filter: drop-shadow(0 6px 0 #000);
    margin-left: 10px;
  }

  .feature-badges {
    display: flex;
    gap: 24px;
    opacity: 0;
    transform: translateY(24px);
    transition: all 0.25s ease;
  }
  .feature-badges.show {
    opacity: 1;
    transform: translateY(0);
  }
  .fbadge {
    background: #111827;
    color: #ffe600;
    border: 5px solid #ffffff;
    border-radius: 16px;
    padding: 14px 32px;
    font-size: 38px;
    font-weight: 900;
    box-shadow: 0 8px 0 #000;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="radial-rays" id="rays"></div>
  <div class="card-frame"></div>
  <div class="retro-vignette"></div>

  <div class="center-stack">
    <div class="intro-pill-row" id="introRow">
      <span class="speaker-pill speaker-shacho">🎙 社長</span>
      <span class="intro-call">そこで今回ご紹介するのがこちら！</span>
    </div>

    <div class="logo-plate" id="logoPlate">
      <div class="sub-tag">🌐 インストール不要！ブラウザで動く</div>
      <div style="display:flex; align-items:baseline; justify-content:center;">
        <span class="main-title-text">箱ダイヤ描画システム</span>
        <span class="title-wave">〜！</span>
      </div>
    </div>

    <div class="feature-badges" id="badgesRow">
      <div class="fbadge">✅ 表に入力するだけ</div>
      <div class="fbadge">✅ リアルタイムSVG作図</div>
      <div class="fbadge">✅ A4/B5 ベクターPDF印刷</div>
    </div>
  </div>
</div>

<script>
  window.seekTo = function(t) {
    document.getElementById("rays").style.transform = `rotate(${t * 14}deg)`;
    document.getElementById("introRow").classList.toggle("show", t >= 0.08);
    document.getElementById("logoPlate").classList.toggle("show", t >= 1.25);
    document.getElementById("badgesRow").classList.toggle("show", t >= 1.90);
  };
  if (new URLSearchParams(location.search).get("manual") !== "1") {
    const s = performance.now();
    (function loop() {
      window.seekTo(((performance.now() - s) / 1000) % 5.0);
      requestAnimationFrame(loop);
    })();
  }
</script>
</body>
</html>
