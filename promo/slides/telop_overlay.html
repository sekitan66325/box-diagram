<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>実操作画面用 透過オーバーレイテロップ</title>
<link rel="stylesheet" href="./slide_base.css" />
<style>
  html, body, .stage {
    background: transparent !important;
  }

  .overlay-root {
    position: relative;
    width: 1920px;
    height: 1080px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 58px 28px 34px;
  }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .demo-corner-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(180deg, #e60012 0%, #99000b 100%);
    border: 4px solid #ffffff;
    border-radius: 14px;
    padding: 6px 20px;
    color: #ffe600;
    font-size: 27px;
    font-weight: 900;
    box-shadow: 0 0 0 3px #000000, 0 8px 18px rgba(0,0,0,0.55);
  }

  .live-badge {
    background: #111827;
    color: #ffffff;
    border: 4px solid #ffe600;
    border-radius: 14px;
    padding: 6px 18px;
    font-size: 24px;
    font-weight: 900;
    box-shadow: 0 6px 14px rgba(0,0,0,0.5);
  }

  .bottom-banner-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .bottom-plate {
    background: linear-gradient(180deg, rgba(15, 23, 42, 0.94) 0%, rgba(0, 0, 0, 0.96) 100%);
    border: 6px solid #ffe600;
    border-radius: 24px;
    padding: 14px 40px;
    box-shadow: 0 0 0 4px #000000, 0 14px 30px rgba(0,0,0,0.75);
    text-align: center;
    max-width: 1840px;
  }

  .bottom-telop-text {
    font-family: var(--font-gothic);
    font-size: 46px;
    font-weight: 900;
    white-space: nowrap;
    background: linear-gradient(180deg, #ffffff 0%, #fff066 55%, #ffae00 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 0 #000000) drop-shadow(4px 0 0 #000) drop-shadow(-4px 0 0 #000) drop-shadow(0 -4px 0 #000);
    line-height: 1.25;
  }

  .bottom-sub-speaker {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 4px;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="overlay-root">
    <div class="top-row">
      <div class="demo-corner-pill" id="cornerBadge">📺 実際の動作画面</div>
      <div class="live-badge" id="rightBadge">🌐 ブラウザ上でリアルタイム動作！</div>
    </div>

    <div class="bottom-banner-wrap">
      <div class="bottom-sub-speaker">
        <span class="speaker-pill speaker-shacho" id="speakerTag">🎙 社長</span>
      </div>
      <div class="bottom-plate">
        <div class="bottom-telop-text" id="telopText">ブラウザで動く『箱ダイヤ描画システム』〜！</div>
      </div>
    </div>
  </div>
</div>

<script>
  const MODES = {
    "scene2b": {
      corner: "📺 実際のアプリ画面（桜川電鉄 サンプル）",
      right: "🌐 ブラウザでそのまま動作！",
      speakerClass: "speaker-shacho",
      speakerText: "🎙 社長",
      text: "ブラウザで動く『箱ダイヤ描画システム』〜！"
    },
    "cutA": {
      corner: "⚡ 実演① 駅名・時刻を入れるだけ！",
      right: "✏️ 左に入力 → 右に即描画！",
      speakerClass: "speaker-shacho",
      speakerText: "🎙 社長",
      text: "面倒な罫線引きは一切不要！"
    },
    "cutB": {
      corner: "🚆 実演② 折返し・併結・継走も自動整列！",
      right: "🔍 拡大しても綺麗なベクターSVG",
      speakerClass: "speaker-assistant",
      speakerText: "💐 女性アシスタント",
      text: "データを入力するだけで、あっという間に美しい箱ダイヤが完成〜！"
    },
    "cutC": {
      corner: "🖨 実演③ そのまま A4 / B5 PDF印刷！",
      right: "📄 1:1 ベクターPDF対応",
      speakerClass: "speaker-shacho",
      speakerText: "🎙 社長",
      text: "そのまま印刷までできちゃうんです！"
    }
  };

  window.setMode = function(modeKey) {
    const m = MODES[modeKey] || MODES["scene2b"];
    document.getElementById("cornerBadge").textContent = m.corner;
    document.getElementById("rightBadge").textContent = m.right;
    const sp = document.getElementById("speakerTag");
    sp.className = `speaker-pill ${m.speakerClass}`;
    sp.textContent = m.speakerText;
    document.getElementById("telopText").textContent = m.text;
  };

  const pMode = new URLSearchParams(location.search).get("mode");
  if (pMode) window.setMode(pMode);
</script>
</body>
</html>
